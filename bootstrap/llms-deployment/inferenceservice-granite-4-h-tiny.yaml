apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    argocd.argoproj.io/managed-by: openshift-gitops  
    openshift.io/display-name: granite-4-h-tiny
    serving.knative.openshift.io/enablePassthrough: 'true'
    sidecar.istio.io/inject: 'true'
    sidecar.istio.io/rewriteAppHTTPProbers: 'true'
    argocd.argoproj.io/sync-wave: "1"
    serving.kserve.io/deploymentMode: RawDeployment
  name: granite-4-h-tiny
  namespace: aiworkshop
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - '--max-model-len=6144'
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '4'
          memory: 8Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '4'
          memory: 8Gi
          nvidia.com/gpu: '1'
      runtime: granite-4-h-tiny
      storage:
        key: aws-connection-aiworkshop
        path: granite-4-h-tiny
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: equal
        value: 'NVIDIA-GPU-LARGE'
